name: Cron Jobs

on:
  schedule:
    - cron: '0 * * * *'    # Recordatorios de reunión + webhooks rápidos (cada hora)
    - cron: '0 */2 * * *'   # Marketing, agendas, reminders y nexus (cada 2 horas en vez de cada 15 min)
    - cron: '0 */6 * * *'   # Gas checks, workflows pesados y reconciliaciones (cada 6 horas)

jobs:
  dispatch-webhooks:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch-webhooks
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/dispatch-webhooks"

  process-approvals:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call process-approvals
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/process-approvals"

  process-webhooks:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call process-webhooks
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/process-webhooks"

  marketing:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call marketing
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/marketing"

  marketing-nurture:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call marketing-nurture
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/admin/marketing/cron/process-nurture"

  scheduling-reminders:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduling-reminders
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/scheduling-reminders"

  meeting-reminders:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call meeting-reminders
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/reminders.json \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/meeting-reminders")

          echo "HTTP $RESPONSE"
          cat /tmp/reminders.json || true

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::meeting-reminders failed with HTTP $RESPONSE"
            exit 1
          fi

  agenda-followups:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call agenda-followups
        run: |
          RESPONSE=$(curl -s -w "%{http_code}" -o /tmp/followups.json \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/sovereign-agenda-followups")

          echo "HTTP $RESPONSE"
          cat /tmp/followups.json || true

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::agenda-followups failed with HTTP $RESPONSE"
            exit 1
          fi

  nexus-cron:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call nexus-cron
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/nexus"

  gas-check:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call gas-check
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/gas-check"

  reconcile-withdrawals:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile-withdrawals
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/reconcile-withdrawals"

  hermes-workflows:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call hermes-workflows
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://dash.pandoras.finance/api/v1/hermes/cron/workflows?secret=${{ secrets.CRON_SECRET }}"

  trial-reminders:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call trial-reminders
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/trial-reminders"

  subscription-lifecycle:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call subscription-lifecycle
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/subscription-lifecycle"

  ipfs-repin:
    if: github.event.schedule == '0 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Re-fijar artefactos del vault (seguro IPFS)
        run: |
          # El seguro del vault: si el nodo Kubo perdió bloques (reinicio sin
          # volumen, GC), los re-fija desde el sobre cifrado guardado en Postgres.
          URL="https://dash.pandoras.finance/api/cron/ipfs-repin?limit=40"
          BODY=$(curl -sS --max-time 90 -w '\n%{http_code}' -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL")
          CODE=$(echo "$BODY" | tail -n1)
          PAYLOAD=$(echo "$BODY" | sed '$d')
          echo "$PAYLOAD" | head -c 2000
          echo
          if [ "$CODE" != "200" ]; then
            echo "::error::El repin respondió $CODE"
            exit 1
          fi
          echo "$PAYLOAD" | grep -q '"failed":0' || { echo "::error::Hubo fallos en el repin"; exit 1; }
