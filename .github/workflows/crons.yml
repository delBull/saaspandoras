name: Cron Jobs

on:
  schedule:
    - cron: '*/30 * * * *'  # Webhooks and fast background jobs (cada 30 min en vez de cada 5 min)
    - cron: '0 */2 * * *'   # Marketing, agendas, reminders y nexus (cada 2 horas en vez de cada 15 min)
    - cron: '0 */6 * * *'   # Gas checks, workflows pesados y reconciliaciones (cada 6 horas)

jobs:
  dispatch-webhooks:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call dispatch-webhooks
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/dispatch-webhooks"

  process-approvals:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call process-approvals
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/process-approvals"

  process-webhooks:
    if: github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call process-webhooks
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://pandoras.finance/api/cron/process-webhooks"

  marketing:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call marketing
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/marketing"

  marketing-nurture:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call marketing-nurture
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/admin/marketing/cron/process-nurture"

  scheduling-reminders:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call scheduling-reminders
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/scheduling-reminders"

  agenda-followups:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call agenda-followups
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/sovereign-agenda-followups"

  nexus-cron:
    if: github.event.schedule == '0 */2 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call nexus-cron
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/nexus"

  gas-check:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call gas-check
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/gas-check"

  reconcile-withdrawals:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call reconcile-withdrawals
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/reconcile-withdrawals"

  hermes-workflows:
    if: github.event.schedule == '0 */6 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call hermes-workflows
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://dash.pandoras.finance/api/v1/hermes/cron/workflows?secret=${{ secrets.CRON_SECRET }}"

