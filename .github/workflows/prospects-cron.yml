name: Prospect Worker

on:
  schedule:
    - cron: '*/30 * * * *' # Revisa cada 30 min si algún job de prospección venció
  workflow_dispatch:

jobs:
  prospects:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call prospect worker
        run: |
          RESPONSE=$(curl -s -m 55 -w "%{http_code}" -o /tmp/prospects.json \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://dash.pandoras.finance/api/cron/prospects")

          echo "HTTP $RESPONSE"
          head -c 2000 /tmp/prospects.json || true

          if [ "$RESPONSE" != "200" ]; then
            echo "::error::prospect worker failed with HTTP $RESPONSE"
            exit 1
          fi
